# =====================================================
# APPLICATION
# =====================================================

spring.application.name=api-gateway
server.port=${PORT:8080}


# =====================================================
# EUREKA - DISABLED ON RENDER
# =====================================================

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false


# =====================================================
# JWT
# =====================================================

jwt.secret=${JWT_SECRET}


# =====================================================
# PAYMENT SERVICE
# =====================================================

spring.cloud.gateway.routes[0].id=payment-service
spring.cloud.gateway.routes[0].uri=${PAYMENT_SERVICE_URL}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=paymentCircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/payment-fallback

spring.cloud.gateway.routes[0].filters[1].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[1].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.routes[0].filters[1].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.routes[0].filters[1].args.key-resolver=#{@ipKeyResolver}
# =====================================================
# FUND SERVICE
# =====================================================

spring.cloud.gateway.routes[1].id=fund-service
spring.cloud.gateway.routes[1].uri=${FUND_SERVICE_URL}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/funds/**


# =====================================================
# ORDER SERVICE
# =====================================================

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=${ORDER_SERVICE_URL}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**


# =====================================================
# AUTH SERVICE
# =====================================================

spring.cloud.gateway.routes[3].id=auth-service
spring.cloud.gateway.routes[3].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/**


# =====================================================
# GOOGLE OAUTH2
# =====================================================

spring.cloud.gateway.routes[4].id=auth-service-oauth
spring.cloud.gateway.routes[4].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.routes[4].predicates[0]=Path=/oauth2/**

spring.cloud.gateway.routes[5].id=auth-service-login
spring.cloud.gateway.routes[5].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.routes[5].predicates[0]=Path=/login/**


# =====================================================
# RESILIENCE4J
# =====================================================

resilience4j.circuitbreaker.instances.paymentCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.slidingWindowSize=5
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true


# =====================================================
# REDIS
# =====================================================

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}


# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always


# =====================================================
# CORS
# =====================================================

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.forwarded.enabled=true

# =====================================================
# OTP SERVICE
# =====================================================

spring.cloud.gateway.routes[6].id=otp-service
spring.cloud.gateway.routes[6].uri=${OTP_SERVICE_URL}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/otp/**